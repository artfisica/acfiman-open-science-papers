name: Build papers and deploy Pages
on:
  push:
    paths-ignore:
      - 'papers/*/pdf/**'
      - 'papers/*/figures/*.pdf'
      - '**.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: papers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/xu-cheng/texlive-debian@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e
    env:
      PAPERS_RUNTIME: ghcr.io/xu-cheng/texlive-debian@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate and compile
        run: make all
      - name: Assemble reading portal
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          path: _site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiled-papers
          path: |
            papers/*/pdf/*.pdf
            papers/*/pdf/*.json
            papers/*/figures/*.pdf
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Refuse to publish a stale build
        env:
          BUILT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BUILT_SHA" || {
            echo 'Default branch advanced. Run this workflow again on the latest revision.'
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compiled-papers
          path: papers
      - name: Commit current PDFs
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/*/pdf/manuscript.pdf papers/*/pdf/build-manifest.json papers/*/figures/*.pdf
          if git diff --cached --quiet; then
            echo 'PDFs are already current.'
            exit 0
          fi
          git commit -m 'docs: update compiled manuscripts'
          git push origin "HEAD:$TARGET_BRANCH"
  deploy-pages:
    needs: [build, publish]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reading portal
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
